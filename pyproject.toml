[project]
name = "idempotent-api"
version = "0.1.0"
description = "Idempotent job processing API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
